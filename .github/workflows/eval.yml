name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check the JS
        run: |
          node --check functions/api/sloppify.js
          node --check rules.mjs
          node --check eval-signals.mjs
          node --check golden-eval.mjs
          node --check golden-eval-rules.mjs

  rules-eval:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline rules golden eval
        run: npm run eval:rules

  golden-eval:
    # Spins up the real Pages Function locally and runs the AI slop eval against it.
    # Skips itself (rather than failing) until you've added the ANTHROPIC_API_KEY repo secret.
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for API key
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret not set — skipping the live AI slop eval. Rules eval still gates PRs."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start local Pages dev server
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx --yes wrangler@3 pages dev . --port 8788 --ip 127.0.0.1 > wrangler.log 2>&1 &
          echo "Waiting for the function to answer…"
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:8788/api/sloppify \
                 -H 'content-type: application/json' \
                 -d '{"text":"ping","tone":"casual"}' >/dev/null; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "server did not come up"; cat wrangler.log; exit 1

      - name: Run golden eval
        if: steps.gate.outputs.run == 'true'
        env:
          SLOPPIFY_URL: http://127.0.0.1:8788/api/sloppify
        run: node golden-eval.mjs

      - name: Upload wrangler log on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: wrangler.log
          if-no-files-found: ignore
